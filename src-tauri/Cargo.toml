[package]
name = "varant"
version = "0.1.0"
description = "KittClouds - Varant Native App"
authors = ["KittClouds Team"]
license = "MIT"
repository = "https://github.com/KittClouds/collaborative-canvas"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
log = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Scanner (Phase 4)
regex = "1.12"
once_cell = "1.19"
aho-corasick = "1.1"

# Reality Engine (CST + Graph)
rowan = "0.15"
lasso = { version = "0.7", features = ["multi-threaded"] }
rustworkx-core = "0.15"
cozo = { version = "0.7.6", features = ["storage-sqlite"] }
rayon = "=1.10"  # Pin to fix cozo compatibility
dirs = "5"  # Cross-platform user data directory
parking_lot = "0.12"  # Fast synchronization primitives for RAG

# RAG Embeddings (Phase 2)
fastembed = "4"  # Fast ONNX-based text embeddings (BGE, etc.)

# Phase 2: Will add kittcore as workspace member
# kittcore = { path = "../rust/kittcore", default-features = false }

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 2
debug = true
