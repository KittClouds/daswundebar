[package]
name = "varant"
version = "0.1.0"
description = "KittClouds - Varant Native App"
authors = ["KittClouds Team"]
license = "MIT"
repository = "https://github.com/KittClouds/collaborative-canvas"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
log = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Scanner (Phase 4)
regex = "1.12"
once_cell = "1.19"
aho-corasick = "1.1"

# Reality Engine (CST + Graph)
rowan = "0.15"
lasso = { version = "0.7", features = ["multi-threaded"] }
cozo = { version = "0.7.6", features = ["storage-sqlite"] }
rayon = "=1.10"  # Pin to fix cozo compatibility
dirs = "5"  # Cross-platform user data directory
parking_lot = "0.12"  # Fast synchronization primitives for RAG
uuid = { version = "1", features = ["v4"] }  # UUID generation
chrono = "0.4"  # Date/time handling

# RAG Embeddings (Phase 2)
fastembed = "4"  # Fast ONNX-based text embeddings (BGE, etc.)

# NER (GLiNER via gline-rs)
gline-rs = { version = "1", default-features = false, features = ["load-dynamic"] }
reqwest = { version = "0.12", features = ["stream"] }  # For model download
futures-util = "0.3"  # For streaming download

# Async Runtime + Error Handling
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TauRPC - Typed IPC layer (Phase 2.2)
taurpc = "0.5.2"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
unicode-segmentation = "1.12.0"
strsim = "0.11.1"
petgraph = "0.8.3"
fixedbitset = "0.5.7"

# Phase 2: Will add kittcore as workspace member
# kittcore = { path = "../rust/kittcore", default-features = false }

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 2
debug = true
